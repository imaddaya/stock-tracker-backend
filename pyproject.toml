[project]
name = "stock-tracker-backend"
version = "1.0.0"
description = "FastAPI backend for a stock portfolio tracker with authentication, market data, caching, and scheduled email summaries."
authors = [
    { name = "Imad Daya" }
]
requires-python = ">=3.10"

dependencies = [
    "bcrypt>=4.3.0",
    "cryptography>=45.0.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]